<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{ title }}</title>
    {% if g.google_site_verification|length > 0 %}
    <meta name="google-site-verification" content="{{ g.google_site_verification }}">
    {% endif %}
    <link rel="apple-touch-icon" sizes="140x140" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        #cwfm-root { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="cwfm-root"></div>

    <script type="text/javascript">
        window.calibre = {
            filePath: "{{ url_for('static', filename='js/libs/') }}",
            cssPath: "{{ url_for('static', filename='css/') }}",
            bookmarkUrl: "{{ url_for('web.set_bookmark', book_id=bookid, book_format=book_format) }}",
            bookUrl: "{{ url_for('web.serve_book', book_id=bookid, book_format=book_format, anyname='file.epub') }}",
            bookmark: "{{ bookmark.bookmark_key if bookmark != None }}",
            useBookmarks: "{{ current_user.is_authenticated | tojson }}"
        };
        (function () {
            var bookUrl = window.calibre.bookUrl || '';
            var bookIdMatch = bookUrl.match(/\/read\/(\d+)\//);
            window.calibre.bookId = bookIdMatch ? bookIdMatch[1] : String(Date.now());
            function readStorage(key) {
                try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
            }
            window.calibre.initialSettings = readStorage('cwfm-settings');
            window.calibre.initialPosition = readStorage('cwfm-position-' + window.calibre.bookId);
            document.addEventListener('cwfm:gm-set', function (e) {
                try { localStorage.setItem(e.detail.key, JSON.stringify(e.detail.value)); }
                catch (err) { console.error('[cwfm] localStorage write failed', err); }
            });
        })();
    </script>

    <!-- Step 1: 以 ES module 載入 foliate bundle，定義 foliate-view 等 custom elements -->
    <script type="module" src="{{ url_for('static', filename='js/cwfm/foliate-view.bundle.js') }}"></script>

    <!-- Step 2: 等 foliate-view 定義完成後，fetch app-ui.js、替換佔位字串、再注入執行 -->
    <script type="text/javascript">
    (function () {
        var BOOK_ID = window.calibre.bookId;
        var VIEWER_SELECTOR = '#cwfm-root';
        var initialSettings = window.calibre.initialSettings;
        var initialPosition = window.calibre.initialPosition;

        function fetchText(url) {
            return fetch(url).then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + url);
                return res.text();
            });
        }

        function injectScript(src) {
            return new Promise(function (resolve, reject) {
                var script = document.createElement('script');
                script.textContent = src;
                document.head.appendChild(script);
                resolve();
            });
        }

        customElements.whenDefined('foliate-view').then(function () {
            return fetchText('{{ url_for("static", filename="js/cwfm/app-ui.js") }}');
        }).then(function (appSrc) {
            appSrc = appSrc.replace(
                'const INITIAL_SETTINGS = "__INITIAL_SETTINGS__";',
                'const INITIAL_SETTINGS = ' + (initialSettings ? JSON.stringify(initialSettings) : 'null') + ';'
            );
            appSrc = appSrc.replace(
                'const INITIAL_POSITION = "__INITIAL_POSITION__";',
                'const INITIAL_POSITION = ' + (initialPosition ? JSON.stringify(initialPosition) : 'null') + ';'
            );
            appSrc = appSrc.replace(
                "const BOOK_ID = '__BOOK_ID__';",
                "const BOOK_ID = " + JSON.stringify(BOOK_ID) + ";"
            );
            appSrc = appSrc.replace(
                "const VIEWER_SELECTOR = '__VIEWER_SELECTOR__';",
                "const VIEWER_SELECTOR = " + JSON.stringify(VIEWER_SELECTOR) + ";"
            );
            return injectScript(appSrc);
        }).catch(function (err) {
            console.error('[cwfm] 閱讀器載入失敗:', err);
            document.body.innerHTML = '<p style="color:#ff6b6b;padding:40px;font-family:sans-serif;font-size:16px">閱讀器載入失敗，請重新整理頁面。<br><small>' + err.message + '</small></p>';
        });
    })();
    </script>
</body>
</html>
