name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'build/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      check_only:
        description: '比照排程：只有上游有新版才建置（不勾＝強制建置）'
        type: boolean
        default: false
  # 每天台灣時間中午 12:00（UTC 04:00）檢查上游 linuxserver/calibre-web 有沒有新版，
  # 有才重新建置。GitHub 排程尖峰時可能延遲數分鐘到數十分鐘。
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 決定要不要建置：排程觸發時比對上游 image digest，推送/手動觸發一律建置 ──
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.chk.outputs.build }}
      digest: ${{ steps.chk.outputs.digest }}
      version: ${{ steps.chk.outputs.version }}
      trigger_time: ${{ steps.chk.outputs.trigger_time }}
    steps:
      - uses: actions/checkout@v4
      - id: chk
        run: |
          set -eu
          # 觸發時間只在這裡算一次，RSS 標題用這個（台北時間）
          echo "trigger_time=$(TZ=Asia/Taipei date +'%Y-%m-%dT%H:%M:%S+08:00')" >> "$GITHUB_OUTPUT"
          IMG=lscr.io/linuxserver/calibre-web:latest
          DIGEST=""
          for i in 1 2 3; do
            DIGEST=$(docker buildx imagetools inspect "$IMG" --format '{{json .Manifest.Digest}}' | tr -d '"') && [ -n "$DIGEST" ] && break
            echo "讀取上游 digest 第 $i 次失敗，重試..."; sleep 10
          done
          [ -n "$DIGEST" ] || { echo "::error::讀不到上游 image digest"; exit 1; }
          VERSION=$(docker buildx imagetools inspect "$IMG" --format '{{json .Image}}' \
            | jq -r '(."linux/amd64" // .).config.Labels["build_version"] // empty' 2>/dev/null || true)
          RECORDED=$(cat .state/upstream_digest.txt 2>/dev/null || echo "")
          echo "上游：$DIGEST（$VERSION）；上次建置：${RECORDED:-無}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event_name == 'workflow_dispatch' && inputs.check_only == true }}" != "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$DIGEST" != "$RECORDED" ]; then
            echo "上游有新版，開始建置"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "上游沒有更新，跳過"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check-upstream
    if: needs.check-upstream.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ github.sha }}

      # 建置成功才記錄這次用的上游版本；失敗不記錄，隔天排程會再試
      - name: 記錄上游版本
        env:
          DIGEST: ${{ needs.check-upstream.outputs.digest }}
          VERSION: ${{ needs.check-upstream.outputs.version }}
        run: |
          set -eu
          mkdir -p .state
          [ "$(cat .state/upstream_digest.txt 2>/dev/null || true)" = "$DIGEST" ] && { echo "版本記錄未變"; exit 0; }
          echo "$DIGEST" > .state/upstream_digest.txt
          echo "$VERSION" > .state/upstream_version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .state
          git commit -m "記錄上游 calibre-web 版本：${VERSION:-$DIGEST}（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北時間）"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            echo "推送衝突，重試中（第 $i 次）..."; sleep $((RANDOM % 5 + 1))
          done
          echo "::error::版本記錄推送失敗"; exit 1

  # ── 每次執行都寫一則狀態 RSS（build_status.xml），格式比照 browser-tools/route-rain ──
  report:
    needs: [check-upstream, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 組出本次狀態並寫入 RSS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_RESULT: ${{ needs.check-upstream.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          EVENT: ${{ github.event_name }}
          TRIGGER_TIME: ${{ needs.check-upstream.outputs.trigger_time }}
          NEW_VERSION: ${{ needs.check-upstream.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          git pull -q origin main || true
          [ -n "$TRIGGER_TIME" ] || TRIGGER_TIME=$(TZ=Asia/Taipei date +'%Y-%m-%dT%H:%M:%S+08:00')
          T_HM=$(TZ=Asia/Taipei date -d "$TRIGGER_TIME" +'%H:%M')
          T_DATE=$(TZ=Asia/Taipei date -d "$TRIGGER_TIME" +'%Y.%m.%d')
          # 「Linuxserver.io version:- 0.6.27-ls404 Build-date:- 2026-10-04T05:49:48+00:00」→「0.6.27-ls404（2026-10-04 發布）」
          fmt() { echo "$1" | sed -nE 's/.*version:- *([^ ]+).*Build-date:- *([0-9-]{10}).*/\1（\2 發布）/p'; }
          OLD_RAW=$(git show "${{ github.sha }}:.state/upstream_version.txt" 2>/dev/null || true)
          NEW=$(fmt "$NEW_VERSION"); OLD=$(fmt "$OLD_RAW")
          OLD_SHORT=${OLD%%（*}; NEW_SHORT=${NEW%%（*}
          REF=$(sed -n 's/^ARG CWFM_MOD_REF=//p' Dockerfile)
          MODVER=$(curl -s --max-time 30 "https://raw.githubusercontent.com/bgtsai/calibre-web-foliate-mod/${REF}/calibre-web-foliate-mod.user.js" | head -5 | sed -n 's#^// @version *##p')
          READER="mod v${MODVER:-?}（${REF:0:7}）"
          if [ "$EVENT" = "schedule" ]; then WHY="上游有新版"; else WHY="${EVENT} 觸發"; fi

          # 失敗時抓出失敗的步驟與錯誤訊息
          fail_detail() {
            JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" 2>/dev/null || echo '{}')
            STEP=$(echo "$JOBS" | jq -r '[.jobs[]? | select(.conclusion=="failure") | .name + "／" + ([.steps[]? | select(.conclusion=="failure") | .name] | join("、"))] | join("；")')
            MSG=""
            for id in $(echo "$JOBS" | jq -r '.jobs[]? | select(.conclusion=="failure") | .id'); do
              MSG="$MSG$(gh api "repos/${{ github.repository }}/check-runs/$id/annotations" --jq '[.[] | select(.annotation_level=="failure") | .message] | join(" / ")' 2>/dev/null | head -c 400)"
            done
            echo "【失敗步驟】${STEP:-（無法取得）}"
            echo "【錯誤訊息】${MSG:-（無法取得，請看執行紀錄）}"
            echo "【執行紀錄】$RUN_URL"
          }

          if [ "$CHECK_RESULT" != "success" ]; then
            TITLE="🔴 ${T_HM} ${T_DATE}｜檢查失敗"
            DESC=$(printf '%s\n%s\n' "【摘要】讀取上游版本失敗，本次未建置" "$(fail_detail)")
          elif [ "$BUILD_RESULT" = "skipped" ]; then
            TITLE="🟢 ${T_HM} ${T_DATE}｜上游無更新"
            DESC=$(printf '%s\n' "【摘要】上游 linuxserver/calibre-web 沒有新版，本次不建置" "【上游版本】${NEW:-$NEW_VERSION}" "【閱讀器版本】${READER}")
          elif [ "$BUILD_RESULT" = "success" ]; then
            TITLE="🔵 ${T_HM} ${T_DATE}｜已更新建置"
            if [ -n "$OLD_SHORT" ] && [ "$OLD_SHORT" != "$NEW_SHORT" ]; then UP="${OLD_SHORT} → ${NEW}"; else UP="${NEW:-$NEW_VERSION}"; fi
            DESC=$(printf '%s\n' "【摘要】${WHY}，已重新建置並推送 image" "【上游版本】${UP}" "【閱讀器版本】${READER}" "【image】ghcr.io/${{ github.repository }}:latest")
          else
            TITLE="🔴 ${T_HM} ${T_DATE}｜建置失敗"
            if [ -n "$OLD_SHORT" ] && [ "$OLD_SHORT" != "$NEW_SHORT" ]; then UP="${OLD_SHORT} → ${NEW}"; else UP="${NEW:-$NEW_VERSION}"; fi
            DESC=$(printf '%s\n%s\n%s\n' "【摘要】${WHY}，但建置失敗，image 維持上一版" "【上游版本】${UP}" "【閱讀器版本】${READER}"; fail_detail)
          fi
          echo "$TITLE"; echo "$DESC"

          write_rss() {
            RSS_FILE=build_status.xml CHANNEL_TITLE="Calibre-Web Foliate Docker 建置狀態" \
            CHANNEL_DESC="每日檢查上游 linuxserver/calibre-web 並自動建置的執行紀錄" \
            CHANNEL_LINK="https://github.com/${{ github.repository }}" \
            ITEM_TITLE="$TITLE" ITEM_DESC="$DESC" ITEM_GUID="cwfm-docker-${{ github.run_id }}-${{ github.run_attempt }}" \
            python3 .github/scripts/rss_append.py
            git add build_status.xml
            git commit -q -m "建置狀態 RSS：${TITLE}"
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          write_rss
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && exit 0
            echo "推送衝突，重試中（第 $i 次）..."; sleep $((RANDOM % 5 + 1))
            # 兩邊都改了同一份 RSS：捨棄本地這次，拉最新後重新寫入
            git fetch -q origin main && git reset -q --hard origin/main && write_rss
          done
          echo "::error::狀態 RSS 推送失敗"; exit 1
